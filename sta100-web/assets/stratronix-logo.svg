<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 56" fill="none">
  <!-- STRATRONIX 标志：六边形 (蜂巢/算力) + 字母 wordmark -->
  <defs>
    <linearGradient id="gx" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10b981"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  <!-- 六边形：Think Big, Compute Small -->
  <g transform="translate(4,4)">
    <polygon points="24,2 44,14 44,38 24,50 4,38 4,14"
             fill="url(#gx)" opacity="0.18"/>
    <polygon points="24,2 44,14 44,38 24,50 4,38 4,14"
             fill="none" stroke="url(#gx)" stroke-width="2"/>
    <!-- 内嵌自行车意象（轮+把） -->
    <circle cx="24" cy="32" r="8" fill="none" stroke="#10b981" stroke-width="2"/>
    <circle cx="24" cy="32" r="2" fill="#10b981"/>
    <path d="M16 18 L24 18 L28 26" fill="none" stroke="#06b6d4" stroke-width="2" stroke-linecap="round"/>
  </g>
  <!-- wordmark -->
  <text x="58" y="26" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif"
        font-size="18" font-weight="800" letter-spacing="2" fill="#e2e8f0">STRATRONIX</text>
  <text x="58" y="42" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif"
        font-size="9" font-weight="500" letter-spacing="3" fill="#94a3b8">CYCLING AGENT · STA-100</text>
</svg>